[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dvm-run"
dynamic = ["version"]
description = "Sandboxes whose every run replays: dvm.run's Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.scripts]
dvm-run = "dvm.__main__:main"

[project.urls]
Homepage = "https://dvm.run"

[tool.hatch.version]
path = "src/dvm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
